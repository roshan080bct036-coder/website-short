<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f5f2">
<title>Portfolio Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<header class="topbar">
  <a class="studio-mark" href="index.html" aria-label="Return to portfolio">D<span>.</span></a>
  <div class="topbar__title">
    <span class="topbar__eyebrow">PORTFOLIO STUDIO</span>
    <strong id="adminName">Website editor</strong>
  </div>
  <div class="topbar__status" id="saveStatus" role="status" aria-live="polite">
    <span class="status-dot"></span><span>Draft ready</span>
  </div>
  <div class="topbar__actions">
    <button class="button button--quiet" id="undoButton" type="button" disabled>Undo</button>
    <button class="button button--quiet" id="importButton" type="button">Import backup</button>
    <button class="button button--primary" id="exportButton" type="button">Download site data</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
</header>

<div class="admin-layout">
  <aside class="sidebar">
    <p class="sidebar__label">EDIT YOUR SITE</p>
    <nav class="section-nav" id="sectionNav" aria-label="Editor sections"></nav>
    <div class="sidebar__note">
      <span class="sidebar__note-mark" aria-hidden="true">i</span>
      <p>Drafts save in this browser. Download site data to publish your changes.</p>
    </div>
    <a class="sidebar__return" href="index.html">View portfolio <span aria-hidden="true">↗</span></a>
  </aside>

  <main class="workspace">
    <section class="editor-pane" aria-label="Portfolio editor">
      <div class="editor-pane__scroll" id="editorContent"></div>
    </section>
    <section class="preview-pane" aria-label="Live website preview">
      <div class="preview-toolbar">
        <div class="preview-toolbar__label"><span class="preview-live-dot"></span> LIVE PREVIEW</div>
        <div class="preview-toolbar__actions">
          <button class="preview-mode is-active" type="button" data-preview="desktop" aria-pressed="true">Desktop</button>
          <button class="preview-mode" type="button" data-preview="mobile" aria-pressed="false">Mobile</button>
          <a class="preview-open" href="index.html" target="_blank" rel="noopener">Open site ↗</a>
        </div>
      </div>
      <div class="preview-stage" id="previewStage">
        <iframe id="sitePreview" title="Live preview of the portfolio website" src="index.html"></iframe>
      </div>
    </section>
  </main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
